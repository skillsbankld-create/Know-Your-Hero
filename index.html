<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اكتشف شخصيتك | Skills Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#080828;--ice:#EBF4FF;--gold:#FFBC3A;--blue:#4D88E8;--red:#F26444;--cyan:#40BDA9;--muted:#5A5A72}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Cairo',sans-serif;background:var(--ice);color:var(--navy);overflow-x:hidden;transition:background .6s}
body.kids,body.tweens{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif}
body.setup{background:linear-gradient(180deg,#EBF4FF,#fff)}
body.kids{background:linear-gradient(180deg,#9fd4ff 0%,#EBF4FF 55%,#fff4d6 100%)}
body.tweens{background:linear-gradient(160deg,#EBF4FF,#d9f3ee 60%,#fff1d0)}
body.teens{background:radial-gradient(ellipse at top,#1a1a4a,#080828 70%);color:#fff}
body.youth{background:linear-gradient(160deg,#1c2a6b,#080828 60%)}
body.young{background:#f6f9ff}

/* decor + fx */
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#decor span{position:absolute;font-size:34px;opacity:.35;animation:float 9s ease-in-out infinite}
body.teens #decor span{color:var(--gold);font-size:18px;opacity:.6;animation:twinkle 3s infinite}
body.youth #decor span{color:#fff;opacity:.07;font-size:120px}
@keyframes float{50%{transform:translate(8px,-18px)}}
@keyframes twinkle{50%{opacity:.15}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#printzone{display:none}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:760px;margin:0 auto;position:relative;z-index:2}
.logo{color:var(--navy)}
.logo svg{height:34px;display:block}
.logo img{height:42px;display:block}
body.teens .logo,body.youth .logo{color:#fff}
.tools{display:flex;gap:8px}
.lang{font:inherit;font-weight:800;font-size:15px;color:var(--navy)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(8,8,40,.12)}
#app{max-width:760px;margin:0 auto;padding:8px 16px 30px;position:relative;z-index:2}
.foot{text-align:center;font-size:13px;color:var(--muted);padding:6px 16px 24px;position:relative;z-index:2}
body.teens .foot,body.youth .foot{color:#9da0c8}

/* cards */
.card{background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 18px 40px -18px rgba(8,8,40,.35);position:relative}
body.kids .card{border-radius:32px;border:4px solid #fff;box-shadow:0 10px 0 #cfe3ff,0 24px 40px -18px rgba(8,8,40,.35)}
body.tweens .card{border-radius:28px;box-shadow:0 8px 0 #bfe9e0,0 24px 40px -20px rgba(8,8,40,.3)}
body.teens .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,188,58,.35);box-shadow:0 0 40px -10px rgba(255,188,58,.25);backdrop-filter:blur(6px)}
body.young .card{border-radius:16px;box-shadow:0 1px 0 #e3e9f5,0 12px 30px -18px rgba(8,8,40,.25)}
.screen.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:14px}

/* type */
.h1{font-size:30px;font-weight:800;line-height:1.4;margin:6px 0 8px}
.h2{font-size:24px;font-weight:800;margin:6px 0 14px;line-height:1.5}
.lead{font-size:17px;line-height:1.9;color:var(--muted)}
.muted{color:var(--muted);font-weight:700}
body.teens .lead,body.teens .muted,body.teens .qnum{color:#c9cbe8}
.center{text-align:center}
.hero-emoji{font-size:64px;text-align:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* forms & buttons */
.lbl{display:block;font-weight:700;margin:18px 0 8px}
.inp{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid #d6e4fb;background:#f7fbff;outline:none;color:var(--navy)}
.inp:focus{border-color:var(--blue)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{font:inherit;font-weight:800;font-size:17px;border:none;border-radius:14px;padding:13px 22px;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .2s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--gold);color:var(--navy);box-shadow:0 5px 0 #d99a1c}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor;opacity:.75}
.btn.navy{background:var(--navy);color:#fff}
.btn.wa{background:#25D366;color:#fff}
.btn.big{width:100%;font-size:20px;padding:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
body.teens .btn.navy{background:var(--gold);color:var(--navy)}
.row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.row .btn.primary{flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.dots i{width:28px;height:6px;border-radius:6px;background:#d6e4fb}
.dots i.on{background:var(--gold)}
.parent-hint{font-size:14px;color:var(--muted);background:var(--ice);border-radius:12px;padding:10px 12px;margin-top:18px;line-height:1.8}

/* age */
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:10px 0}
.round{width:56px;height:56px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:28px;cursor:pointer}
body.teens .round{background:var(--gold);color:var(--navy)}
.agev{font-size:64px;font-weight:800;min-width:110px;text-align:center;color:var(--navy)}
body.teens .agev{color:var(--gold)}
.range{width:100%;accent-color:var(--gold)}
.stage-chip{margin-top:14px;text-align:center;background:var(--ice);border-radius:14px;padding:12px;font-weight:700;line-height:1.7}
body.teens .stage-chip{background:rgba(255,255,255,.08)}

/* choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.choice{font:inherit;border:3px solid #e3ecfa;background:#fff;border-radius:20px;padding:20px 10px;cursor:pointer;font-size:20px;font-weight:800;color:var(--navy);transition:.2s}
.choice span{display:block;font-size:56px;margin-bottom:6px}
.choice:hover{transform:translateY(-3px);border-color:var(--gold)}
.choice.sel{border-color:var(--gold);background:#fff8e8;box-shadow:0 0 0 4px rgba(255,188,58,.25)}
.avatars{grid-template-columns:repeat(3,1fr)}
.avatars .choice{padding:14px 6px}
.avatars .choice span{font-size:44px;margin:0}
body.teens .choice{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:#fff}
body.teens .choice.sel{background:rgba(255,188,58,.15);border-color:var(--gold)}

/* intro */
.intro{text-align:center}
.guide-big{font-size:84px}
.tag{display:inline-block;background:var(--ice);color:var(--navy);font-weight:700;font-size:14px;padding:5px 12px;border-radius:30px}
body.teens .tag{background:rgba(255,188,58,.15);color:var(--gold)}
.rules{list-style:none;text-align:start;margin:18px auto;max-width:440px;display:grid;gap:8px}
.rules li{background:var(--ice);border-radius:12px;padding:10px 14px;font-weight:600}
body.teens .rules li{background:rgba(255,255,255,.06)}
.note{background:#fff4dc;color:var(--navy);border-radius:12px;padding:10px;margin-bottom:14px;font-size:14px;line-height:1.8}

/* progress */
.stars{display:flex;justify-content:center;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.stars span{font-size:26px;opacity:.4;transition:.3s}
.stars span.on{opacity:1;animation:pop .4s}
.stars span.cur{opacity:1;transform:scale(1.25)}
.lvl{text-align:center;font-weight:800;color:var(--navy);margin-bottom:4px}
.map{position:relative;display:flex;justify-content:space-between;align-items:center;margin:4px 6px 18px;height:48px}
.map::before{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:4px dashed #9fcfc5;transform:translateY(-2px)}
.node{position:relative;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #9fcfc5;z-index:1;display:grid;place-items:center;font-size:0}
.node.flag{border-color:var(--gold)}
.node.done{background:var(--cyan);border-color:var(--cyan)}
.node.cur{width:44px;height:44px;font-size:24px;border-color:var(--gold);box-shadow:0 0 0 5px rgba(255,188,58,.3)}
.xp{margin-bottom:16px}
.xp-top{display:flex;justify-content:space-between;font-size:14px;color:var(--gold);font-weight:700;margin-bottom:6px}
.xp-bar{height:10px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden}
.xp-bar i{display:block;height:100%;background:linear-gradient(270deg,var(--gold),var(--red));transition:width .5s}
.pbar{margin-bottom:14px}
.pbar-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px;color:#fff}
body.young .pbar-top{color:var(--navy)}
.pbar-track{height:8px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden}
body.young .pbar-track{background:#e3e9f5}
.pbar-track i{display:block;height:100%;border-radius:8px;background:var(--cyan);transition:width .5s}

/* question */
.qnum{font-size:14px;font-weight:700;color:var(--muted)}
.chapter{display:inline-block;font-size:13px;font-weight:800;color:var(--blue);background:var(--ice);padding:4px 10px;border-radius:20px;margin-bottom:8px}
.qtext{font-size:23px;font-weight:800;line-height:1.6;margin:6px 0 18px}
body.kids .qtext{font-size:26px;text-align:center}
body.kids .qnum{text-align:center}
.guide-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px}
.guide{font-size:52px;animation:bob 2.4s infinite}
.me{font-size:34px}
.speak{border:none;background:var(--ice);border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer}
.opts{display:grid;gap:12px}
.opts.tiles{grid-template-columns:1fr 1fr}
.opt{font:inherit;text-align:start;cursor:pointer;border:3px solid transparent;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;color:var(--navy);transition:transform .15s,border-color .2s,box-shadow .2s;background:#f5f8ff;line-height:1.6}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opts.tiles .opt{flex-direction:column;justify-content:center;text-align:center;min-height:150px;padding:14px 10px}
.opt .oe{font-size:48px;line-height:1}
body.tweens .opt .oe{font-size:38px}
.opts.tiles .p0{background:#e6f0ff}.opts.tiles .p1{background:#fff4dc}.opts.tiles .p2{background:#e2f6f2}.opts.tiles .p3{background:#ffe9e3}
.ol{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--navy);color:var(--gold);font-weight:800}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,188,58,.3)}
.opt.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.06)}}
body.teens .opt{background:rgba(255,255,255,.05);color:#fff;border-color:rgba(255,255,255,.12)}
body.teens .opt:hover,body.teens .opt.sel{border-color:var(--gold)}
body.teens .ol{background:var(--gold);color:var(--navy)}
body.young .opt{background:#fff;border:2px solid #e3e9f5}
body.young .opt.sel,body.young .opt:hover{border-color:var(--blue)}
.qnav{margin-top:16px;display:flex}
.linkbtn{background:none;border:none;font:inherit;color:var(--muted);cursor:pointer;font-weight:700;font-size:15px}
body.teens .linkbtn{color:#c9cbe8}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,8,40,.55);display:grid;place-items:center;z-index:50;padding:16px;animation:enter .25s}
.mcard{background:#fff;border-radius:28px;padding:30px 24px;text-align:center;max-width:380px;width:100%;color:var(--navy)}
.micon{font-size:82px;animation:spinpop .7s}
@keyframes spinpop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:none}}
.mcard h3{font-size:24px;margin:8px 0}
.mcard p{color:var(--muted);line-height:1.8;margin-bottom:18px}
body.teens .mcard{background:#11113a;color:#fff;border:1px solid var(--gold)}
body.teens .mcard p{color:#c9cbe8}

/* loading */
.loader{font-size:76px;display:inline-block;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.lbar{height:8px;background:var(--ice);border-radius:8px;overflow:hidden;margin-top:10px}
body.teens .lbar{background:rgba(255,255,255,.1)}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(270deg,var(--cyan),var(--gold));animation:load 2.4s forwards}
@keyframes load{to{width:100%}}

/* result */
.result{border-top:8px solid var(--tc)}
body.teens .result{border-top:8px solid var(--tc)}
.res-top{display:flex;align-items:center;gap:14px}
.res-top .mid{flex:1}
.avatar{font-size:38px;width:64px;height:64px;border-radius:50%;background:var(--ice);display:grid;place-items:center;flex:none}
body.teens .avatar{background:rgba(255,255,255,.08)}
.ticon{font-size:54px;width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 18%,#fff);flex:none;animation:spinpop .8s}
.tname{font-size:28px;color:var(--tc);font-weight:800;line-height:1.35}
.tie{margin-top:12px;background:var(--ice);color:var(--navy);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.8}
.tabs{display:flex;gap:8px;margin:18px 0 12px;background:rgba(255,255,255,.65);padding:6px;border-radius:16px}
.tab{flex:1;font:inherit;font-weight:800;font-size:15px;border:none;background:transparent;padding:10px 6px;border-radius:12px;cursor:pointer;color:var(--navy)}
.tab.on{background:var(--navy);color:#fff}
body.teens .tabs,body.youth .tabs{background:rgba(255,255,255,.08)}
body.teens .tab,body.youth .tab{color:#fff}
body.teens .tab.on{background:var(--gold);color:var(--navy)}
body.youth .tab.on{background:#fff;color:var(--navy)}
.panel{display:none}.panel.on{display:block;animation:enter .35s}
.sec-t{font-size:18px;font-weight:800;margin:4px 0 12px}
.bar-row{display:grid;grid-template-columns:minmax(130px,40%) 1fr 46px;align-items:center;gap:10px;margin:10px 0;font-weight:700;font-size:15px}
.bt{height:12px;background:var(--ice);border-radius:12px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:12px;width:var(--w);animation:grow 1.1s ease-out}
@keyframes grow{from{width:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:30px;font-weight:700;background:color-mix(in srgb,var(--tc) 16%,#fff);color:var(--navy)}
.tipbox{background:#fff8e8;color:var(--navy);border-inline-start:5px solid var(--gold);padding:14px 16px;border-radius:12px;line-height:1.9;font-weight:600}
body.teens .bt{background:rgba(255,255,255,.1)}
body.teens .chip{background:rgba(255,255,255,.08);color:#fff}
body.teens .tipbox{background:rgba(255,188,58,.1);color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1;min-width:150px}

/* parent guide */
.pill{display:inline-block;background:var(--navy);color:var(--gold);font-size:13px;font-weight:800;padding:4px 12px;border-radius:20px}
body.teens .pill{background:var(--gold);color:var(--navy)}
.pg-head h2{font-size:22px;margin:10px 0 6px;line-height:1.5}
.pg-head p{line-height:1.9;color:var(--muted)}
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pg-sec{background:var(--ice);border-radius:14px;padding:14px}
.pg-sec.warn{background:#ffece7}
.pg-sec h4,.pg-box h4{font-size:16px;margin-bottom:8px;color:var(--navy)}
.pg-sec ul,.pg-box ul{padding-inline-start:18px;line-height:1.9;font-size:15px}
.pg-box{margin-top:14px;border-radius:14px;padding:14px;border:2px dashed var(--cyan)}
.pg-box.gold{border-color:var(--gold)}
.disc{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.8}
body.teens .pg-sec{background:rgba(255,255,255,.06)}
body.teens .pg-sec.warn{background:rgba(242,100,68,.14)}
body.teens .pg-sec h4,body.teens .pg-box h4{color:var(--gold)}
body.teens .pg-head p,body.teens .disc{color:#c9cbe8}

/* certificate */
.cert{background:#fff;color:var(--navy);border-radius:18px;padding:12px;box-shadow:0 18px 40px -18px rgba(8,8,40,.4)}
.cert-in{border:3px solid var(--gold);border-radius:12px;padding:28px 20px;text-align:center;position:relative;background:linear-gradient(135deg,#fff 60%,#fff8e8)}
.cert-in::before{content:"";position:absolute;inset:6px;border:1px solid rgba(8,8,40,.15);border-radius:8px;pointer-events:none}
.cert .logo{display:flex;justify-content:center}
.cert .logo svg,.cert .logo img{height:54px}
.cert-title{font-size:28px;font-weight:800;margin:14px 0 6px}
.cert-name{font-size:34px;font-weight:800;color:var(--blue);margin:8px 0;border-bottom:2px dashed var(--gold);display:inline-block;padding:0 20px 4px}
.cert p{line-height:1.9;color:var(--muted)}
.cert-type{font-size:26px;font-weight:800;margin:8px 0 14px}
.cert-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid #e3e9f5;padding-top:10px;margin-top:10px;gap:8px;flex-wrap:wrap}
.seal{position:absolute;inset-inline-end:20px;bottom:46px;font-size:46px;transform:rotate(-12deg)}
.print-logo{margin-bottom:14px}.print-logo svg{height:36px}

@media(max-width:560px){
 .pg-grid{grid-template-columns:1fr}
 .opts.tiles .opt{min-height:130px;font-size:16px}
 .h1{font-size:25px}.qtext{font-size:20px}body.kids .qtext{font-size:22px}
 .bar-row{grid-template-columns:1fr 46px}.bar-row .bt{grid-column:1/-1;order:3}
 .tname{font-size:23px}.ticon{width:64px;height:64px;font-size:40px}.avatar{display:none}
 .tab{font-size:13px}.seal{display:none}.cert-name{font-size:27px}
}
@media print{
 @page{margin:12mm}
 body.printing>*:not(#printzone){display:none!important}
 body.printing{background:#fff!important}
 body.printing #printzone{display:block}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pg-sec,.pg-box{break-inside:avoid}
 .cert{box-shadow:none}
}
</style>
</head>
<body class="setup">
<div id="decor"></div>
<header class="top">
  <div class="logo" id="logo"></div>
  <div class="tools"><button id="lng" class="icon-btn lang" aria-label="English">EN</button><button id="snd" class="icon-btn" aria-label="Sound">🔊</button></div>
</header>
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<canvas id="fx"></canvas>
<div id="printzone"></div>

<script>
/* ================= إعدادات الهوية =================
   ضع رابط شعار Skills Bank هنا (PNG أو SVG) ليحل محل الشعار المؤقت:

function t(s){
  const f = state.gender === 'f', en = state.lang === 'en';
  return String(s).replace(/\[([^\]|]*)\|([^\]]*)\]/g,(m,a,b)=>f?b:a)
    .replace(/\{h\}/g,f?'ها':'ه').replace(/\{y\}/g,f?'ت':'ي')

    .replace(/\{he\}/g,f?'she':'he').replace(/\{him\}/g,f?'her':'him').replace(/\{his\}/g,f?'her':'his')
    .replace(/\{name\}/g,esc(state.name));
}

  document.body.className = k;
  $('#logo').innerHTML = logoHTML(isDark(k));
  $('#decor').innerHTML = (DECOR[k]||[]).map((e,i)=>`<span style="top:${(i*37)%88+4}%;left:${(i*53)%88+4}%;animation-delay:${i*.7}s">${e}</span>`).join('');
}
function applyLang(){
  const h = document.documentElement;
  h.lang = state.lang; h.dir = EN() ? 'ltr' : 'rtl';
  document.title = UI[state.lang].title;
  $('#foot').textContent = UI[state.lang].foot;
  $('#lng').textContent = UI[state.lang].langBtn;
  $('#lng').setAttribute('aria-label', EN() ? 'العربية' : 'English');
}
function show(html){ app.innerHTML = `<div class="screen enter">${html}</div>`; window.scrollTo({top:0,behavior:'smooth'}); }
function card(inner,cls=''){return `<div class="card ${cls}">${inner}</div>`}

/* sound */
let AC;
function tone(f,d=.12,type='sine',delay=0,vol=.08){
  if(!state.sound) return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const s=AC.currentTime+delay;g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}
}
const sfx = {tap:()=>tone(440,.07),pick:()=>{tone(660,.1,'triangle');tone(880,.12,'triangle',.08)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.1))};
$('#snd').onclick = () => { state.sound=!state.sound; $('#snd').textContent = state.sound?'🔊':'🔇'; if(!state.sound&&'speechSynthesis' in window) speechSynthesis.cancel(); };
$('#lng').onclick = () => {
  const nm = $('#nm'); if(nm && nm.value.trim()) state.name = nm.value.trim();
  state.lang = EN() ? 'ar' : 'en'; applyLang(); sfx.tap();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.modal').forEach(m=>m.remove()); state.lock = false;
  if(state.cur) state.cur();
};

/* read-aloud */
function speak(txt){
  try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt.replace(/[\u{1F000}-\u{1FAFF}☀-➿️‍«»“”]/gu,''));
    const lang=UI[state.lang].voice; u.lang=lang; u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith(lang.slice(0,2))); if(v) u.voice=v; speechSynthesis.speak(u);
  }catch(e){}
}

/* confetti */
function confetti(n=140){
  const c=$('#fx'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#FFBC3A','#F26444','#40BDA9','#4D88E8','#ffffff'];
  const ps=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:6+Math.random()*6,h:8+Math.random()*8,vx:-2+Math.random()*4,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(tm){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(tm-t0<3200)requestAnimationFrame(f);else ctx.clearRect(0,0,c.width,c.height)})(t0);
}

/* scoring */
function counts(){const c={D:0,I:0,S:0,C:0};state.answers.forEach(a=>{if(a)c[a]++});return c}
function leader(){const c=counts();return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]}
function scores(){
  const c=counts(),n=state.answers.filter(Boolean).length||1;
  const order=Object.keys(c).sort((a,b)=>c[b]-c[a]);
  const p={};order.forEach(k=>p[k]=Math.round(c[k]*100/n));
  p[order[0]]+=100-order.reduce((s,k)=>s+p[k],0);
  return {c,p,order};
}

/* ================= Setup ================= */
function renderSetup(step){
  state.cur = () => renderSetup(step);
  const dots=`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`;
  const back=`<button class="btn ghost" id="back">${U('back')}</button>`;
  if(step===0){
    setTheme('setup');
    show(card(`${dots}<div class="hero-emoji bob">🧭</div>
      <h1 class="h1 center">${U('hero')}</h1>
      <p class="lead center">${U('lead')}</p>
      <label class="lbl" for="nm">${U('askName')}</label>
      <input id="nm" class="inp" maxlength="30" placeholder="${U('namePh')}" value="${esc(state.name)}" autocomplete="off">
      <div class="row"><button class="btn primary big" id="next">${U('next')}</button></div>
      <p class="parent-hint">${U('parentHint')}</p>`));
    const inp=$('#nm'); setTimeout(()=>inp.focus(),300);
    const go=()=>{const v=inp.value.trim();if(!v){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);return}state.name=v;sfx.tap();renderSetup(1)};
    $('#next').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter')go()};
  }
  if(step===1){
    show(card(`${dots}<div class="hero-emoji">🎂</div>
      <h2 class="h2 center">${U('ageQ')}</h2>
      <div class="stepper"><button class="round" id="plus" aria-label="+">+</button><div class="agev" id="agev">${state.age}</div><button class="round" id="minus" aria-label="-">−</button></div>
      <input type="range" min="4" max="30" value="${state.age}" id="ager" class="range" aria-label="age">
      <div class="stage-chip" id="stchip"></div>
      <div class="row">${back}<button class="btn primary" id="next">${U('next')}</button></div>`));
    const upd=v=>{state.age=Math.max(4,Math.min(30,v));$('#agev').textContent=state.age;$('#ager').value=state.age;const k=stageFor(state.age);state.stage=k;const st=STG(k);$('#stchip').innerHTML=`${st.icon} ${U('journey')}: «${st.theme}»<br><small>${st.label}</small>`.replace(/«(.*)»/,EN()?'“$1”':'«$1»');if(document.body.className!==k)setTheme(k)};
    upd(state.age);
    $('#plus').onclick=()=>{sfx.tap();upd(state.age+1)}; $('#minus').onclick=()=>{sfx.tap();upd(state.age-1)};
    $('#ager').oninput=e=>upd(+e.target.value);
    $('#back').onclick=()=>renderSetup(0); $('#next').onclick=()=>{sfx.tap();renderSetup(2)};
  }
  if(step===2){
    const young=state.age<13;
    const opts=young?[['m','👦',U('boy')],['f','👧',U('girl')]]:[['m','🧑',U('male')],['f','👩',U('female')]];
    show(card(`${dots}<h2 class="h2 center">${young?U('youAre'):U('gender')}</h2>
      <div class="choices">${opts.map(([v,e,l])=>`<button class="choice ${state.gender===v?'sel':''}" data-v="${v}"><span>${e}</span>${l}</button>`).join('')}</div>
      <div class="row">${back}</div>`));
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{state.gender=b.dataset.v;b.classList.add('sel');sfx.pick();setTimeout(()=>renderSetup(3),250)});
    $('#back').onclick=()=>renderSetup(1);
  }
  if(step===3){
    const set=state.age<=12?AVATARS[state.gender]:AVATARS.older;
    if(!set.includes(state.avatar)) state.avatar='';
    show(card(`${dots}<h2 class="h2 center">${state.age<=12?U('avatarKid'):U('avatarOld')}</h2>
      <div class="choices avatars">${set.map(e=>`<button class="choice ${state.avatar===e?'sel':''}" data-v="${e}"><span>${e}</span></button>`).join('')}</div>
      <div class="row">${back}<button class="btn primary" id="next" ${state.avatar?'':'disabled'}>${U('start')}</button></div>`));
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{app.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.avatar=b.dataset.v;sfx.pick();$('#next').disabled=false});
    $('#back').onclick=()=>renderSetup(2);
    $('#next').onclick=()=>{state.qi=0;state.answers=[];state.order=[];state.rewarded={};state.tab='me';renderIntro()};
  }
}

/* ================= Intro ================= */
function renderIntro(){
  state.cur = renderIntro;
  const st=STG(state.stage);
  setTheme(state.stage);
  show(card(`<div class="guide-big bob">${st.guide}</div>
    <div class="tag">${st.label}</div>
    <h1 class="h1">${st.icon} ${st.theme}</h1>
    <p class="lead">${t(st.intro)}</p>
    <ul class="rules"><li>${U('r1')}</li><li>${U('r2')}</li><li>${U('count')(st.q.length)}</li>${st.speak?`<li>${U('r4')}</li>`:''}</ul>
    ${state.age<7?`<p class="note">${U('parentNote')}</p>`:''}
    <button class="btn primary big" id="go">${t(st.cta)}</button>`,'intro'));
  $('#go').onclick=()=>{sfx.win();renderQuestion()};
}

/* ================= Questions ================= */
function progressHTML(st){
  const N=st.q.length,i=state.qi;
  if(st.progress==='stars') return `<div class="stars">${Array.from({length:N},(_,k)=>`<span class="${k<i?'on':k===i?'cur':''}">${k<i?'⭐':'☆'}</span>`).join('')}</div>`;
  if(st.progress==='map') return `<div class="lvl">${U('level')(Math.min(4,Math.floor(i/3)+1))}</div><div class="map">${Array.from({length:N},(_,k)=>`<span class="node ${k<i?'done':''} ${k===i?'cur':''} ${(k+1)%3===0?'flag':''}">${k===i?state.avatar:''}</span>`).join('')}</div>`;
  if(st.progress==='xp'){const r=t(st.ranks[Math.min(3,Math.floor(i/3))]);return `<div class="xp"><div class="xp-top"><span>🎖️ ${r}</span><span>XP ${i*25} / ${N*25}</span></div><div class="xp-bar"><i style="width:${i/N*100}%"></i></div></div>`}
  return `<div class="pbar"><div class="pbar-top"><span>${U('chOf')(Math.floor(i/3)+1)}</span><span>${Math.round(i/N*100)}%</span></div><div class="pbar-track"><i style="width:${i/N*100}%"></i></div></div>`;
}
function renderQuestion(){
  state.cur = renderQuestion;
  const st=STG(state.stage),N=st.q.length,i=state.qi,Q=st.q[i];
  if(!state.order[i]) state.order[i]=shuffle([0,1,2,3]);
  const letters=EN()?['A','B','C','D']:['أ','ب','ج','د'];
  const opts=state.order[i].map((k,pos)=>{const [ty,em,tx]=Q.o[k];
    return `<button class="opt p${pos} ${state.answers[i]===ty?'sel':''}" data-t="${ty}">${st.layout==='tiles'?`<span class="oe">${em}</span>`:`<span class="ol">${letters[pos]}</span>`}<span class="ot">${t(tx)}</span></button>`}).join('');
  const guide=st.speak?`<div class="guide-row"><span class="me">${state.avatar}</span><span class="guide">${st.guide}</span><button class="speak" id="spk" aria-label="listen">🔊</button></div>`:'';
  const chapter=st.chapters?`<div class="chapter">${U('ch')} ${Math.floor(i/3)+1}: ${st.chapters[Math.floor(i/3)]}</div>`:'';
  show(`${progressHTML(st)}${card(`${guide}${chapter}<div class="qnum">${U('qOf')(i+1,N)}</div>
    <h2 class="qtext">${t(Q.q)}</h2>
    <div class="opts ${st.layout}">${opts}</div>
    <div class="qnav">${i>0?`<button class="linkbtn" id="prev">${U('prev')}</button>`:''}</div>`,'qcard')}`);
  if(st.speak) $('#spk').onclick=()=>speak(t(Q.q)+'. '+state.order[i].map(k=>t(Q.o[k][2])).join(U('or')));
  if(i>0) $('#prev').onclick=()=>{state.qi--;renderQuestion()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(state.lock) return; state.lock=true;
    app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel','pop'); sfx.pick(); state.answers[i]=b.dataset.t;
    if('speechSynthesis' in window) speechSynthesis.cancel();
    setTimeout(()=>{state.lock=false;nextQ()},450);
  });
}
function nextQ(){
  const N=STAGES[state.stage].q.length;
  state.qi++;
  if(state.qi>=N) return renderAnalyzing();
  if(state.qi%3===0 && !state.rewarded[state.qi]){state.rewarded[state.qi]=true;return showReward(state.qi/3-1,renderQuestion)}
  renderQuestion();
}
function showReward(idx,cb){
  let r=STG(state.stage).rewards[idx]; if(typeof r==='function') r=r();
  sfx.win(); if(kidish()) confetti(60);
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="mcard"><div class="micon">${r.i}</div><h3>${t(r.t)}</h3><p>${t(r.x)}</p><button class="btn primary big" id="mcont">${U('cont')}</button></div>`;
  document.body.appendChild(m);
  m.querySelector('#mcont').onclick=()=>{m.remove();cb()};
}

/* ================= Analyzing ================= */
function renderAnalyzing(){
  state.cur = () => {};
  const st=STG(state.stage);
  show(card(`<div class="loader">${st.icon}</div><h2 class="h2" id="lm">${t(st.loading[0])}</h2><div class="lbar"><i></i></div>`,'center'));
  let k=0; const iv=setInterval(()=>{k++;const L=STG(state.stage).loading;if(k<L.length&&$('#lm'))$('#lm').textContent=t(L[k])},800);
  setTimeout(()=>{clearInterval(iv);renderResult()},2500);
}

/* ================= Result ================= */
function guideHTML(order,p){
  const k=order[0],k2=order[1],G=GD(k),st=STG(state.stage);
  const secs=Object.entries(PGL()).map(([key,[ic,lb]])=>`<div class="pg-sec ${key==='avoid'?'warn':''}"><h4>${ic} ${t(lb)}</h4><ul>${G[key].map(x=>`<li>${t(x)}</li>`).join('')}</ul></div>`).join('');
  return `<div class="pg-head"><span class="pill">${U('pill')}</span>
    <h2>${U('child')} ${esc(state.name)} (${U('age')(state.age)}) — ${t(TYP(k).name)} ${TYP(k).icon}</h2>
    <p><b>${U('nature')}</b> ${st.parent}</p></div>
    <div class="pg-grid">${secs}</div>
    <div class="pg-box"><h4>🎯 ${U('stageTips')}</h4><ul>${STIPS()[state.stage][k].map(x=>`<li>${t(x)}</li>`).join('')}</ul></div>
    <div class="pg-box gold"><h4>🔀 ${U('second')}: ${t(TYP(k2).name)} (${p[k2]}%)</h4><ul><li>${t(GD(k2).motivate[0])}</li><li>${t(GD(k2).talk[0])}</li></ul></div>
    <p class="disc">${U('disc')}</p>`;
}
function certHTML(k){
  const T=TYP(k),st=STG(state.stage),d=new Date().toLocaleDateString(UI[state.lang].locale,{year:'numeric',month:'long',day:'numeric'});
  return `<div class="cert" id="cert"><div class="cert-in"><div class="logo">${logoHTML(false)}</div>
    <div class="cert-title">${U('cTitle')}</div>
    <p>${U('cGrant')}</p>
    <div class="cert-name">${esc(state.name)}</div>
    <p>${t(U('cDone')(st.theme))}</p>
    <div class="cert-type" style="color:${T.color}">${T.kid} ${t(T.name)}</div>
    <span class="seal">🏅</span>
    <div class="cert-foot"><span>${U('cDate')} ${d}</span><span>${U('cFoot')}</span></div></div></div>`;
}
function renderResult(silent){
  state.cur = () => renderResult(true);
  const {p,order,c}=scores(),k=order[0],P=TYP(k),K=kidish();
  const tie=c[order[0]]===c[order[1]];
  const strengths=K?P.str:P.strOld;
  const tab=state.tab;
  show(`
  <div class="card result" style="--tc:${P.color}">
    <div class="res-top"><span class="avatar">${state.avatar}</span>
      <div class="mid"><div class="muted">${U('resIs')}</div><h1 class="tname">${t(P.name)}</h1></div>
      <div class="ticon">${K?P.kid:P.icon}</div></div>
    <p class="lead" style="margin-top:12px">${t(K?P.desc:P.descOld)}</p>
    ${tie?`<div class="tie">${t(U('tie')(TYP(order[0]).name,TYP(order[1]).name))}</div>`:''}
  </div>
  <div class="tabs"><button class="tab ${tab==='me'?'on':''}" data-p="me">${U('tMe')}</button><button class="tab ${tab==='guide'?'on':''}" data-p="guide">${U('tGuide')}</button><button class="tab ${tab==='cert'?'on':''}" data-p="cert">${U('tCert')}</button></div>
  <div class="panel ${tab==='me'?'on':''}" id="p-me">${card(`<div class="stack" style="--tc:${P.color}">
    <div><div class="sec-t">${U('blend')}</div>${order.map(x=>`<div class="bar-row"><span>${K?TYPES[x].kid:TYPES[x].icon} ${t(TYP(x).name)}</span><div class="bt"><i style="--w:${p[x]}%;background:${TYPES[x].color}"></i></div><b>${p[x]}%</b></div>`).join('')}</div>
    <div><div class="sec-t">${U('strengths')}</div><div class="chips">${strengths.map(s=>`<span class="chip">${s}</span>`).join('')}</div></div>
    <div><div class="sec-t">${U('tipT')}</div><div class="tipbox">${t(K?P.tip:P.tipOld)}</div></div></div>`)}</div>
  <div class="panel ${tab==='guide'?'on':''}" id="p-guide">${card(`<div id="guide">${guideHTML(order,p)}</div><div class="actions"><button class="btn navy" id="prGuide">${U('prGuide')}</button></div>`)}</div>
  <div class="panel ${tab==='cert'?'on':''}" id="p-cert">${certHTML(k)}<div class="actions"><button class="btn primary" id="prCert">${U('prCert')}</button></div></div>
  <div class="actions"><button class="btn wa" id="wa">${U('wa')}</button><button class="btn ghost" id="again">${U('again')}</button></div>`);
  if(!silent){ sfx.win(); confetti(); }
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.p;app.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));app.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id==='p-'+b.dataset.p));sfx.tap()});
  $('#prGuide').onclick=()=>printEl('guide',true);
  $('#prCert').onclick=()=>printEl('cert',false);
  $('#wa').onclick=()=>{
    const X=UI[state.lang],st=STG(state.stage);
    const txt=`${X.waHead}\n\n${X.waName}: ${state.name}\n${X.waAge}: ${state.age}\n${X.waStage}: ${st.label}\n\n${X.waMain}: ${t(TYP(order[0]).name)} (${p[order[0]]}%)\n${X.waSec}: ${t(TYP(order[1]).name)} (${p[order[1]]}%)\n${X.waStr}: ${strengths.join(X.sep)}`;
    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  };
  $('#again').onclick=()=>{state.name='';state.gender='';state.avatar='';state.age=8;state.tab='me';renderSetup(0)};
}
function printEl(id,withLogo){
  const z=$('#printzone'),prev=document.body.className;
  z.innerHTML=(withLogo?`<div class="print-logo logo">${logoHTML(false)}</div>`:'')+document.getElementById(id).outerHTML;
  document.body.className='young printing';
  setTimeout(()=>{window.print();setTimeout(()=>{document.body.className=prev;z.innerHTML=''},400)},50);
}

applyLang();
renderSetup(0);

</script>
